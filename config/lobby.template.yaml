server:
  address: 0.0.0.0:7777
  geolite2path: ./geolite2/GeoLite2-Country.mmdb
  templatepath: ./web/templates

database:
  # mysql, postgres, sqlite
  type: sqlite
  # database specific connection string
  connection: ":memory:"

relay:
  nyc: "example.relay.com:55435"

# Optional LibretroDroid TCP rendezvous. Enable only after opening this TCP port.
# advertisehost must bypass HTTP proxies/CDNs and reach this listener directly.
traversal:
  address: "" # set to "[::]:55436" to enable IPv4 + IPv6
  advertisehost: "" # e.g. direct.example.com (A and preferably AAAA records)
  publicport: 55436

blacklist:
  nickname:
    - someRE1.*
    - someRE2.*
  ips:
   - 1.1.1.1
   - 8.8.8.8
